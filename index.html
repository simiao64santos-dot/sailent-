<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ SAILENT HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
	* { margin: 0; padding: 0; box-sizing: border-box; }

	:root {
		--bg: #0a0a0f;
		--card: #12121a;
		--card-hover: #1a1a26;
		--border: #1f1f2e;
		--accent: #7c9eff;
		--text: #f0f0f5;
		--sub: #8a8a9e;
		--green: #4ade80;
		--yellow: #fbbf24;
		--purple: #a78bfa;
		--red: #f87171;
	}

	body {
		font-family: 'Inter', sans-serif;
		background: var(--bg);
		color: var(--text);
		min-height: 100vh;
		padding: 40px 24px;
		background-image:
			radial-gradient(circle at 15% 15%, rgba(124, 158, 255, 0.08) 0%, transparent 40%),
			radial-gradient(circle at 85% 85%, rgba(167, 139, 250, 0.08) 0%, transparent 40%);
		background-attachment: fixed;
	}

	.container { max-width: 1200px; margin: 0 auto; }

	header {
		text-align: center;
		margin-bottom: 50px;
	}

	.logo {
		font-size: 48px;
		font-weight: 800;
		letter-spacing: -2px;
		background: linear-gradient(135deg, #7c9eff 0%, #a78bfa 100%);
		-webkit-background-clip: text;
		-webkit-text-fill-color: transparent;
		background-clip: text;
		margin-bottom: 10px;
	}

	.subtitle {
		font-size: 15px;
		color: var(--sub);
		margin-bottom: 18px;
	}

	.lock-badge {
		display: inline-flex;
		align-items: center;
		gap: 8px;
		padding: 8px 16px;
		background: var(--card);
		border: 1px solid var(--border);
		border-radius: 999px;
		font-size: 12px;
		color: var(--sub);
		font-weight: 600;
	}

	.grid {
		display: grid;
		grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
		gap: 24px;
		max-width: 1100px;
		margin: 0 auto;
	}

	.card {
		background: var(--card);
		border: 1px solid var(--border);
		border-radius: 16px;
		padding: 28px;
		transition: all 0.25s;
		position: relative;
		overflow: hidden;
	}

	.card::before {
		content: '';
		position: absolute;
		top: 0; left: 0; right: 0;
		height: 3px;
		background: var(--card-color, var(--accent));
	}

	.card:hover {
		background: var(--card-hover);
		border-color: var(--card-color, var(--accent));
		transform: translateY(-4px);
		box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
	}

	.card-check {
		position: absolute;
		top: 22px;
		right: 22px;
		width: 26px;
		height: 26px;
		border-radius: 50%;
		background: var(--green);
		display: flex;
		align-items: center;
		justify-content: center;
		color: #0a0a0f;
		font-size: 14px;
		font-weight: 700;
	}

	.card-header {
		display: flex;
		align-items: flex-start;
		gap: 14px;
		margin-bottom: 18px;
	}

	.card-icon {
		font-size: 32px;
		width: 56px;
		height: 56px;
		display: flex;
		align-items: center;
		justify-content: center;
		background: rgba(255, 255, 255, 0.03);
		border-radius: 14px;
		border: 1px solid var(--border);
		flex-shrink: 0;
	}

	.card-title-wrap { flex: 1; min-width: 0; }

	.card-title {
		font-size: 17px;
		font-weight: 700;
		margin-bottom: 4px;
	}

	.card-file {
		font-size: 11px;
		color: var(--sub);
		font-family: 'JetBrains Mono', monospace;
	}

	.card-desc {
		font-size: 13.5px;
		color: var(--sub);
		line-height: 1.65;
		margin-bottom: 18px;
	}

	.tags {
		display: flex;
		flex-wrap: wrap;
		gap: 6px;
		margin-bottom: 18px;
	}

	.tag {
		font-size: 10.5px;
		font-weight: 600;
		padding: 5px 11px;
		border-radius: 6px;
		background: rgba(124, 158, 255, 0.1);
		color: var(--accent);
		font-family: 'JetBrains Mono', monospace;
		border: 1px solid rgba(124, 158, 255, 0.2);
	}

	.code-preview {
		background: #08080c;
		border: 1px solid var(--border);
		border-radius: 10px;
		padding: 14px 16px;
		margin-bottom: 18px;
		font-family: 'JetBrains Mono', monospace;
		font-size: 11px;
		color: var(--sub);
		word-break: break-all;
		line-height: 1.5;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}

	.code-preview .cmd { color: var(--purple); }
	.code-preview .arg { color: var(--green); }
	.code-preview .url { color: var(--accent); }

	.actions {
		display: flex;
		gap: 10px;
	}

	.btn {
		padding: 13px 18px;
		border: none;
		border-radius: 10px;
		font-family: 'Inter', sans-serif;
		font-size: 13px;
		font-weight: 700;
		cursor: pointer;
		transition: all 0.15s;
		display: flex;
		align-items: center;
		justify-content: center;
		gap: 8px;
	}

	.btn-copy {
		flex: 1;
		background: var(--card-color, var(--accent));
		color: #0a0a0f;
	}

	.btn-copy:hover {
		filter: brightness(1.15);
		transform: translateY(-1px);
		box-shadow: 0 8px 25px var(--card-color, var(--accent));
	}

	.btn-copy.copied { background: var(--green); }

	.btn-raw {
		background: rgba(255, 255, 255, 0.05);
		color: var(--text);
		border: 1px solid var(--border);
		padding: 13px 22px;
	}

	.btn-raw:hover {
		background: rgba(255, 255, 255, 0.1);
		border-color: var(--accent);
	}

	.toast {
		position: fixed;
		bottom: 30px;
		right: 30px;
		background: var(--green);
		color: #0a0a0f;
		padding: 14px 22px;
		border-radius: 12px;
		font-weight: 700;
		font-size: 13px;
		box-shadow: 0 10px 40px rgba(74, 222, 128, 0.4);
		transform: translateY(120px);
		opacity: 0;
		transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
		z-index: 1000;
	}

	.toast.show { transform: translateY(0); opacity: 1; }
	.toast.error { background: var(--red); }

	footer {
		text-align: center;
		margin-top: 60px;
		color: var(--sub);
		font-size: 12px;
	}

	footer b { color: var(--accent); }

	@media (max-width: 700px) {
		body { padding: 24px 14px; }
		.logo { font-size: 34px; }
		.grid { grid-template-columns: 1fr; gap: 16px; }
		.card { padding: 22px; }
		.toast { left: 14px; right: 14px; bottom: 14px; text-align: center; }
	}
</style>
</head>
<body>

<div class="container">

	<header>
		<h1 class="logo">⚡ SAILENT HUB</h1>
		<p class="subtitle">Painel privado de scripts</p>
		<div class="lock-badge">🔒 Acesso restrito</div>
	</header>

	<div class="grid" id="grid"></div>

	<footer>
		Painel <b>Sailent</b> • Scripts privados
	</footer>

</div>

<div class="toast" id="toast">✅ Copiado!</div>

<script>
const USER = "simiao64santos-dot";
const REPO = "sailent-";
const BRANCH = "main";

const SCRIPTS = [
	{
		id: "gari",
		icon: "🗑️",
		name: "Sailent Auto Gari v7.0",
		file: "main.lua",
		desc: "Coleta e entrega lixo automaticamente. Noclip embutido + God Mode. Interface nova + velocidade única (a pé e voo) controlada por 1 slider. Modo A Pé ou Voar.",
		color: "#4ade80",
		tags: ["Vel única", "Noclip", "God Mode", "A Pé/Voar", "Anti-AFK"]
	},
	{
		id: "prisao",
		icon: "🔓",
		name: "Sailent Auto Prisão v3.1",
		file: "prisao.lua",
		desc: "Varre o perímetro completo e entrega caixas. Reduz a pena sem esforço. Interface nova + velocidade única (a pé e voo) controlada por 1 slider.",
		color: "#a78bfa",
		tags: ["Varredura", "Caixas", "Vel única", "Noclip", "Anti-AFK"]
	},
	{
		id: "pizza",
		icon: "🍕",
		name: "Sailent Auto Pizza v6.1b",
		file: "pizza.lua",
		desc: "Pega pedido e entrega no cliente automaticamente. Modo Seguro (andar rápido) por padrão com anti-kick e anti-dano de queda. Voo aéreo opcional com aviso. Velocidade única (a pé + voo), espera entre entregas e anti-sit.",
		color: "#fbbf24",
		tags: ["Anti-kick", "Anti-queda", "Vel única", "Espera", "Anti-Sit"]
	},
	{
		id: "eletricista",
		icon: "⚡",
		name: "Sailent Auto Eletricista v3.2",
		file: "eletricista.lua",
		desc: "Pega escada no carro, teleporta pro topo do poste e conserta. Marca postes já feitos. God Mode ativo + velocidade única + anti-sit + noclip.",
		color: "#f87171",
		tags: ["TP topo", "God Mode", "Vel única", "Anti-Sit", "Noclip"]
	}
];

function buildURL(file) {
	return `https://raw.githubusercontent.com/${USER}/${REPO}/refs/heads/${BRANCH}/${file}`;
}

function buildLoadstring(file) {
	return `loadstring(game:HttpGet("${buildURL(file)}"))()`;
}

function escapeHtml(t) {
	const d = document.createElement("div");
	d.textContent = t;
	return d.innerHTML;
}

const grid = document.getElementById("grid");

SCRIPTS.forEach(s => {
	const card = document.createElement("div");
	card.className = "card";
	card.style.setProperty("--card-color", s.color);

	const url = buildURL(s.file);
	const load = buildLoadstring(s.file);

	card.innerHTML = `
		<div class="card-check">✓</div>
		<div class="card-header">
			<div class="card-icon">${s.icon}</div>
			<div class="card-title-wrap">
				<div class="card-title">${escapeHtml(s.name)}</div>
				<div class="card-file">${escapeHtml(s.file)}</div>
			</div>
		</div>
		<div class="card-desc">${escapeHtml(s.desc)}</div>
		<div class="tags">
			${s.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("")}
		</div>
		<div class="code-preview">
			<span class="cmd">loadstring</span>(<span class="arg">game:HttpGet</span>(<span class="url">"${escapeHtml(url)}"</span>))()
		</div>
		<div class="actions">
			<button class="btn btn-copy" data-copy="${encodeURIComponent(load)}">
				📋 Copiar Loadstring
			</button>
			<button class="btn btn-raw" data-open="${escapeHtml(url)}">
				🔗 Raw
			</button>
		</div>
	`;

	grid.appendChild(card);
});

const toast = document.getElementById("toast");
let toastTimer;

function showToast(txt, isError = false) {
	toast.textContent = txt;
	toast.className = "toast show" + (isError ? " error" : "");
	clearTimeout(toastTimer);
	toastTimer = setTimeout(() => toast.className = "toast", 2200);
}

async function copyText(text) {
	try {
		await navigator.clipboard.writeText(text);
		return true;
	} catch (e) {
		const ta = document.createElement("textarea");
		ta.value = text;
		ta.style.position = "fixed";
		ta.style.opacity = "0";
		document.body.appendChild(ta);
		ta.select();
		const ok = document.execCommand("copy");
		document.body.removeChild(ta);
		return ok;
	}
}

document.addEventListener("click", async (e) => {
	const copyBtn = e.target.closest("[data-copy]");
	if (copyBtn) {
		const text = decodeURIComponent(copyBtn.dataset.copy);
		const ok = await copyText(text);
		if (ok) {
			copyBtn.classList.add("copied");
			const original = copyBtn.innerHTML;
			copyBtn.innerHTML = "✅ Copiado!";
			showToast("✅ Loadstring copiado!");
			setTimeout(() => {
				copyBtn.classList.remove("copied");
				copyBtn.innerHTML = original;
			}, 1800);
		}
		return;
	}

	const openBtn = e.target.closest("[data-open]");
	if (openBtn) window.open(openBtn.dataset.open, "_blank");
});
</script>

</body>
</html>
