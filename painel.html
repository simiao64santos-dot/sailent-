<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ SAILENT KEY GENERATOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
	* { margin: 0; padding: 0; box-sizing: border-box; }
	:root {
		--bg: #0a0a0f; --card: #12121a; --card-hover: #1a1a26; --border: #1f1f2e;
		--accent: #7c9eff; --text: #f0f0f5; --sub: #8a8a9e;
		--green: #4ade80; --yellow: #fbbf24; --purple: #a78bfa;
		--red: #f87171; --cyan: #22d3ee; --pink: #ec4899;
	}
	body {
		font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
		min-height: 100vh; padding: 40px 24px;
		background-image:
			radial-gradient(circle at 15% 15%, rgba(124, 158, 255, 0.08) 0%, transparent 40%),
			radial-gradient(circle at 85% 85%, rgba(167, 139, 250, 0.08) 0%, transparent 40%);
		background-attachment: fixed;
	}
	.container { max-width: 1200px; margin: 0 auto; }
	header { text-align: center; margin-bottom: 30px; }
	h1 {
		font-size: 42px; font-weight: 800; letter-spacing: -1.5px;
		background: linear-gradient(135deg, #22d3ee 0%, #7c9eff 100%);
		-webkit-background-clip: text; -webkit-text-fill-color: transparent;
		background-clip: text; margin-bottom: 8px;
	}
	.subtitle { font-size: 14px; color: var(--sub); }

	.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

	.card {
		background: var(--card); border: 1px solid var(--border);
		border-radius: 16px; padding: 28px;
		position: relative; overflow: hidden;
	}
	.card::before {
		content: ''; position: absolute; top: 0; left: 0; right: 0;
		height: 3px; background: var(--card-color, var(--accent));
	}
	.card-title { font-size: 16px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
	.card-title-icon {
		width: 36px; height: 36px; border-radius: 10px;
		display: flex; align-items: center; justify-content: center;
		background: var(--card-color, var(--accent)); color: #0a0a0f;
		font-size: 18px; font-weight: 700;
	}

	.form-group { margin-bottom: 16px; }
	.form-label {
		display: block; font-size: 11px; font-weight: 700; color: var(--sub);
		text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
	}
	.form-input, .form-select {
		width: 100%; padding: 12px 14px; background: #0a0a0f;
		border: 1px solid var(--border); border-radius: 10px; color: var(--text);
		font-family: 'JetBrains Mono', monospace; font-size: 13px;
		transition: all 0.15s; outline: none;
	}
	.form-input:focus, .form-select:focus {
		border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124, 158, 255, 0.15);
	}
	.form-select { font-family: 'Inter', sans-serif; font-weight: 600; cursor: pointer; }
	.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
	.form-hint { font-size: 10px; color: var(--sub); margin-top: 6px; }

	.btn {
		width: 100%; padding: 14px;
		background: linear-gradient(135deg, #22d3ee 0%, #7c9eff 100%);
		border: none; border-radius: 10px; color: #0a0a0f;
		font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 800;
		cursor: pointer; transition: all 0.15s; margin-top: 6px;
		letter-spacing: 0.5px;
	}
	.btn:hover { filter: brightness(1.15); transform: translateY(-1px); box-shadow: 0 8px 25px rgba(124, 158, 255, 0.3); }
	.btn:active { transform: translateY(0); }
	.btn.danger { background: linear-gradient(135deg, #f87171 0%, #ec4899 100%); color: #fff; }
	.btn.green { background: linear-gradient(135deg, #4ade80 0%, #22d3ee 100%); }
	.btn.small { padding: 8px 14px; font-size: 11px; margin: 0; width: auto; }

	.output-label {
		display: flex; justify-content: space-between; align-items: center;
		font-size: 10px; font-weight: 700; color: var(--sub);
		text-transform: uppercase; letter-spacing: 0.5px;
		margin-top: 18px; margin-bottom: 8px;
	}
	.output-box {
		background: #08080c; border: 1px solid var(--border);
		border-radius: 10px; padding: 14px;
		font-family: 'JetBrains Mono', monospace;
		font-size: 11px; color: var(--text); line-height: 1.6;
		max-height: 200px; overflow-y: auto;
		white-space: pre-wrap; word-break: break-all;
		display: none;
	}
	.output-box.show { display: block; }
	.output-box.green { border-color: rgba(74, 222, 128, 0.3); }
	.output-box.purple { border-color: rgba(167, 139, 250, 0.3); }

	.mini-btn {
		padding: 6px 12px; background: rgba(255,255,255,0.05);
		border: 1px solid var(--border); border-radius: 8px; color: var(--sub);
		font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 700;
		cursor: pointer; transition: all 0.15s;
	}
	.mini-btn:hover { background: rgba(124, 158, 255, 0.15); color: var(--accent); border-color: var(--accent); }

	.key-line {
		display: flex; justify-content: space-between; align-items: center;
		padding: 10px 14px; background: #0a0a0f; border: 1px solid var(--border);
		border-radius: 8px; font-size: 11px; margin-bottom: 8px;
	}
	.key-line-label { color: var(--sub); font-weight: 600; }
	.key-line-value {
		color: var(--text); font-family: 'JetBrains Mono', monospace; font-weight: 600;
		max-width: 65%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
	}
	.key-line-value.highlight { color: var(--cyan); }

	.empty-state {
		padding: 30px; text-align: center; color: var(--sub);
		font-size: 12px; background: #08080c; border: 1px dashed var(--border);
		border-radius: 12px;
	}

	.history-item {
		padding: 12px 14px; background: #0a0a0f; border: 1px solid var(--border);
		border-radius: 10px; margin-bottom: 8px;
		display: flex; justify-content: space-between; align-items: center; gap: 12px;
	}
	.history-info { flex: 1; min-width: 0; }
	.history-name { font-size: 12px; font-weight: 700; color: var(--text); }
	.history-hash { font-size: 9px; color: var(--sub); font-family: 'JetBrains Mono', monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 3px; }
	.history-actions { display: flex; gap: 6px; }

	.tabs {
		display: flex; justify-content: center; gap: 8px; margin-bottom: 24px;
		padding: 6px; background: var(--card); border: 1px solid var(--border);
		border-radius: 14px; width: fit-content; margin-left: auto; margin-right: auto;
	}
	.tab {
		padding: 10px 22px; background: transparent; border: none; border-radius: 10px;
		color: var(--sub); font-family: 'Inter', sans-serif; font-size: 13px;
		font-weight: 700; cursor: pointer; transition: all 0.2s;
	}
	.tab.active { background: linear-gradient(135deg, #22d3ee 0%, #7c9eff 100%); color: #0a0a0f; }
	.panel { display: none; }
	.panel.active { display: block; }

	.divider { height: 1px; background: var(--border); margin: 22px 0; }

	.toast {
		position: fixed; bottom: 30px; right: 30px;
		background: var(--green); color: #0a0a0f;
		padding: 14px 22px; border-radius: 12px;
		font-weight: 700; font-size: 13px;
		box-shadow: 0 10px 40px rgba(74, 222, 128, 0.4);
		transform: translateY(120px); opacity: 0;
		transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
		z-index: 1000;
	}
	.toast.show { transform: translateY(0); opacity: 1; }
	.toast.error { background: var(--red); box-shadow: 0 10px 40px rgba(248, 113, 113, 0.4); }

	@media (max-width: 900px) {
		.grid { grid-template-columns: 1fr; }
		.form-row { grid-template-columns: 1fr; }
		h1 { font-size: 30px; }
	}
</style>
</head>
<body>

<div class="container">

	<header>
		<h1>⚡ SAILENT KEY GEN</h1>
		<p class="subtitle">Gerador de keys + formatador automático</p>
	</header>

	<div class="grid">

		<!-- GERADOR -->
		<div class="card" style="--card-color: var(--cyan);">
			<div class="card-title">
				<div class="card-title-icon">🔑</div>
				Gerador de Keys
			</div>

			<div class="form-group">
				<label class="form-label">Nome do Cliente</label>
				<input type="text" class="form-input" id="inp-nome" placeholder="Ex: DONO">
			</div>

			<div class="form-group">
				<label class="form-label">Key Crua (que o cliente digita)</label>
				<div style="display: flex; gap: 8px;">
					<input type="text" class="form-input" id="inp-key" placeholder="SAILENT-XXXX-XXXX-XXXX" style="flex: 1;">
					<button class="mini-btn" onclick="gerarKey()" style="flex-shrink: 0;">🎲 GERAR</button>
				</div>
			</div>

			<div class="form-row">
				<div class="form-group">
					<label class="form-label">Nível</label>
					<select class="form-select" id="inp-nivel">
						<option value="normal">Normal</option>
						<option value="vip">VIP</option>
						<option value="admin">Admin</option>
						<option value="owner" selected>Owner</option>
					</select>
				</div>
				<div class="form-group">
					<label class="form-label">Dias</label>
					<input type="number" class="form-input" id="inp-dias" value="0" min="0">
					<div class="form-hint">0 = nunca expira</div>
				</div>
			</div>

			<button class="btn" onclick="processarKey()">⚡ PROCESSAR KEY</button>

			<div id="resultado" style="display: none;">
				<div class="divider"></div>
				<div class="key-line">
					<span class="key-line-label">🔑 KEY:</span>
					<span class="key-line-value highlight" id="out-key">-</span>
				</div>
				<div class="key-line">
					<span class="key-line-label">🔒 HASH:</span>
					<span class="key-line-value" id="out-hash">-</span>
				</div>

				<div class="output-label">
					<span>📋 Linha pro LOCAL_KEYS (Lua)</span>
					<button class="mini-btn" onclick="copiar('out-lua')">📋 COPIAR</button>
				</div>
				<div class="output-box show green" id="out-lua"></div>

				<div class="output-label">
					<span>🌐 Formato keys.json (GitHub)</span>
					<button class="mini-btn" onclick="copiar('out-json')">📋 COPIAR</button>
				</div>
				<div class="output-box show purple" id="out-json"></div>
			</div>
		</div>

		<!-- HISTÓRICO -->
		<div class="card" style="--card-color: var(--purple);">
			<div class="card-title">
				<div class="card-title-icon">📚</div>
				Keys Geradas (Sessão)
			</div>

			<div id="history-list">
				<div class="empty-state">Nenhuma key gerada ainda...</div>
			</div>

			<div class="divider"></div>

			<div class="output-label">
				<span>🌐 keys.json completo (GitHub)</span>
				<button class="mini-btn" onclick="copiar('out-full-json')">📋 COPIAR</button>
			</div>
			<div class="output-box show" id="out-full-json">{
  "keys": {}
}</div>

			<button class="btn danger" onclick="limparHistorico()" style="margin-top: 16px;">🗑️ LIMPAR HISTÓRICO</button>
		</div>

	</div>

</div>

<div class="toast" id="toast">✅ Copiado!</div>

<script>
// ============================================
// SHA-256
// ============================================
async function sha256(message) {
	const buf = new TextEncoder().encode(message);
	const hash = await crypto.subtle.digest('SHA-256', buf);
	return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ============================================
// UTILS
// ============================================
function showToast(txt, isError = false) {
	const t = document.getElementById("toast");
	t.textContent = txt;
	t.className = "toast show" + (isError ? " error" : "");
	clearTimeout(window._toastTimer);
	window._toastTimer = setTimeout(() => t.className = "toast", 2200);
}

function copiar(id) {
	const el = document.getElementById(id);
	if (!el) return;
	navigator.clipboard.writeText(el.textContent).then(() => {
		showToast("✅ Copiado!");
	}).catch(() => {
		const ta = document.createElement("textarea");
		ta.value = el.textContent;
		document.body.appendChild(ta);
		ta.select();
		document.execCommand("copy");
		document.body.removeChild(ta);
		showToast("✅ Copiado!");
	});
}
window.copiar = copiar;

function gerarKey() {
	const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
	const seg = () => Array.from({length: 4}, () => chars[Math.floor(Math.random()*chars.length)]).join("");
	document.getElementById("inp-key").value = `SAILENT-${seg()}-${seg()}-${seg()}`;
}
window.gerarKey = gerarKey;

// ============================================
// HISTÓRICO
// ============================================
let historico = [];

function renderHistorico() {
	const list = document.getElementById("history-list");
	if (historico.length === 0) {
		list.innerHTML = `<div class="empty-state">Nenhuma key gerada ainda...</div>`;
	} else {
		list.innerHTML = historico.map((k, i) => `
			<div class="history-item">
				<div class="history-info">
					<div class="history-name">${escapeHtml(k.nome)} <span style="color: var(--sub); font-size: 10px;">[${k.nivel}]</span></div>
					<div class="history-hash">${escapeHtml(k.hash.substring(0, 32))}...</div>
				</div>
				<div class="history-actions">
					<button class="mini-btn" onclick="copiarHistorico(${i})">📋</button>
					<button class="mini-btn" onclick="removerHistorico(${i})" style="color: var(--red);">🗑️</button>
				</div>
			</div>
		`).join("");
	}
	atualizarFullJson();
}

function escapeHtml(t) {
	const d = document.createElement("div");
	d.textContent = t;
	return d.innerHTML;
}

window.copiarHistorico = (i) => {
	const k = historico[i];
	navigator.clipboard.writeText(k.key).then(() => showToast("✅ Key copiada!"));
};

window.removerHistorico = (i) => {
	historico.splice(i, 1);
	renderHistorico();
};

window.limparHistorico = () => {
	if (!confirm("Limpar todas as keys da sessão?")) return;
	historico = [];
	renderHistorico();
	showToast("🗑️ Histórico limpo!");
};

// ============================================
// GERAR FULL JSON (keys.json pro GitHub)
// ============================================
function atualizarFullJson() {
	if (historico.length === 0) {
		document.getElementById("out-full-json").textContent = `{\n  "keys": {}\n}`;
		return;
	}

	const keysObj = {};
	for (const k of historico) {
		keysObj[k.hash] = {
			nome: k.nome,
			nivel: k.nivel,
			status: "ativa",
			expira: k.expira,
			hwid: "",
			bindMode: "auto",
			boundTo: "",
			boundAt: 0,
			max_usos: -1,
			usos: 0
		};
	}

	const json = {
		keys: keysObj
	};

	document.getElementById("out-full-json").textContent = JSON.stringify(json, null, 2);
}

// ============================================
// PROCESSAR KEY
// ============================================
async function processarKey() {
	const nome = document.getElementById("inp-nome").value.trim();
	const key = document.getElementById("inp-key").value.trim();
	const nivel = document.getElementById("inp-nivel").value;
	const dias = parseInt(document.getElementById("inp-dias").value) || 0;

	if (!nome) { showToast("⚠️ Preencha o nome!", true); return; }
	if (!key) { showToast("⚠️ Gere ou cole uma key!", true); return; }

	const hash = await sha256(key);
	const agora = Math.floor(Date.now() / 1000);
	const expira = dias === 0 ? 99999999999 : agora + (dias * 86400);

	// Mostrar resultado
	document.getElementById("resultado").style.display = "block";
	document.getElementById("out-key").textContent = key;
	document.getElementById("out-hash").textContent = hash;

	// Formato Lua (LOCAL_KEYS)
	const linhaLua = `["${hash}"] = {nome="${nome}", nivel="${nivel}", dias=${dias}},`;
	document.getElementById("out-lua").textContent = linhaLua;

	// Formato keys.json (individual)
	const jsonIndividual = `"${hash}": {\n  "nome": "${nome}",\n  "nivel": "${nivel}",\n  "status": "ativa",\n  "expira": ${expira},\n  "hwid": "",\n  "bindMode": "auto",\n  "boundTo": "",\n  "boundAt": 0,\n  "max_usos": -1,\n  "usos": 0\n}`;
	document.getElementById("out-json").textContent = jsonIndividual;

	// Adicionar ao histórico
	historico.push({
		nome: nome,
		key: key,
		hash: hash,
		nivel: nivel,
		dias: dias,
		expira: expira
	});
	renderHistorico();

	showToast("✅ Key processada!");
}
window.processarKey = processarKey;

// Init
renderHistorico();
</script>

</body>
</html>
